<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS & iOS Lifecycle Tracker</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1115; color: #e1e7ef; padding: 30px; margin: 0; }
        h1 { border-bottom: 2px solid #2f3542; padding-bottom: 15px; color: #ffffff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #181d25; padding: 20px; border-radius: 12px; border: 1px solid #2a313d; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .card h2 { margin-top: 0; color: #fff; font-size: 1.4rem; display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 20px; background: #2f3542; color: #a4b0be; }
        p { margin: 10px 0; font-size: 0.95rem; color: #ccd6f6; }
        strong { color: #8892b0; }
        .status { font-weight: bold; padding: 4px 8px; border-radius: 6px; display: inline-block; font-size: 0.85rem; }
    </style>
</head>
<body>

    <h1>💻 Operating System Lifecycle Tracker</h1>
    <p>Real-time monitoring of Windows and iOS versions, patches, and End-of-Life (EOL) metrics.</p>
    
    <div class="grid" id="os-container"></div>

    <script>
        fetch('os-data.json')
            .then(res => {
                if (!res.ok) throw new Error('Error loading JSON data file');
                return res.json();
            })
            .then(data => {
                const container = document.getElementById('os-container');
                data.forEach(os => {
                    const isActive = os.eol_date.includes("Supported") || os.eol_date.includes("Limited");
                    const statusBg = isActive ? "rgba(0, 255, 119, 0.15)" : "rgba(255, 85, 85, 0.15)";
                    const statusColor = isActive ? "#00ff77" : "#ff5555";
                    const borderLeftColor = os.type === 'Windows' ? '#0078d4' : '#a2aaad';

                    container.innerHTML += `
                        <div class="card" style="border-left: 6px solid ${borderLeftColor}">
                            <h2>${os.os_name} <span class="badge">${os.type}</span></h2>
                            <p>📅 <strong>Release Date:</strong> ${os.release_date}</p>
                            <p>📦 <strong>Latest Patch:</strong> ${os.latest_version}</p>
                            <p>⏱️ <strong>Patch Date:</strong> ${os.latest_patch_date}</p>
                            <p>🛑 <strong>EOL Status:</strong> 
                                <span class="status" style="background: ${statusBg}; color: ${statusColor}">
                                    ${os.eol_date}
                                </span>
                            </p>
                        </div>
                    `;
                });
            })
            .catch(err => {
                document.getElementById('os-container').innerHTML = `<p style="color:#ff5555;">⚠️ An error occurred: ${err.message}</p>`;
            });
    </script>
</body>
</html>
